<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#102719">
<title>Shamrock</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='33' y='10' width='34' height='34' rx='9' transform='rotate%2845 50 27%29' fill='%239fd8ad'/%3E%3Crect x='56' y='33' width='34' height='34' rx='9' transform='rotate%2845 73 50%29' fill='%239fd8ad'/%3E%3Crect x='33' y='56' width='34' height='34' rx='9' transform='rotate%2845 50 73%29' fill='%239fd8ad'/%3E%3Crect x='10' y='33' width='34' height='34' rx='9' transform='rotate%2845 27 50%29' fill='%23f2c14e'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/figtree-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/fraunces-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: Figtree; font-weight: 400; font-display: swap; src: url(fonts/figtree-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: Figtree; font-weight: 600; font-display: swap; src: url(fonts/figtree-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family: Figtree; font-weight: 700; font-display: swap; src: url(fonts/figtree-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: Fraunces; font-weight: 600; font-display: swap; src: url(fonts/fraunces-latin-600-normal.woff2) format('woff2'); }
  /* Shamrock: green felt, paper cards, one warm accent. Text pairs meet WCAG AA. */
  :root {
    --felt: #14301f; --bar: #102719; --sheet: #1a3a28; --line: #3d7a52;
    --fg: #f3f8f1; --dim: #b9d3c0; --hint: #ffe7a6; --leaf: #a8dbb0;
    --go: #f2c14e; --go-fg: #231c05; --on: #8fe0a2; --on-fg: #0b2414; --chip: #ffffff17;
    --sans: Figtree, system-ui, -apple-system, sans-serif; --serif: Fraunces, Georgia, serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--felt); color: var(--fg); font: 16px/1.35 var(--sans); overflow: hidden; }
  /* A game surface, not a document: no text selection, callouts or tap flashes
     (they trigger dictionary lookups on mobile). Inputs stay selectable. */
  body { display: flex; flex-direction: column; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  input, #linkText { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
  button { font: inherit; font-weight: 600; color: inherit; border: 0; border-radius: 999px; background: var(--chip); padding: 9px 16px; min-height: 44px; cursor: pointer; touch-action: manipulation; transition: transform .12s ease, background .2s; }
  button:active:not(:disabled) { transform: scale(.96); }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--hint); outline-offset: 2px; }
  .go { background: var(--go); color: var(--go-fg); font-weight: 700; padding: 10px 22px; font-size: 17px; }
  .go:disabled { background: var(--chip); color: var(--fg); opacity: .65; }
  .go.on { background: var(--on); color: var(--on-fg); }

  #top { display: flex; align-items: center; gap: 10px; padding: calc(6px + env(safe-area-inset-top, 0px)) 10px 6px 12px; background: var(--bar); }
  #logo { display: inline-flex; align-items: center; gap: 7px; font: 600 21px var(--serif); letter-spacing: .02em; white-space: nowrap; color: var(--fg); }
  #logo svg { width: 24px; height: 24px; }
  @media (max-width: 480px) { #logo span { display: none; } }
  #roster { flex: 1; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
  #roster::-webkit-scrollbar { display: none; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px 5px 8px; border-radius: 999px; background: var(--chip); font-size: 15px; font-weight: 600; white-space: nowrap; flex: none; }
  .chip i { width: 11px; height: 11px; border-radius: 50%; flex: none; }
  .chip.you { box-shadow: 0 0 0 2px var(--fg) inset; }
  .chip.writer { box-shadow: 0 0 0 2px var(--go) inset; }
  .chip.away { opacity: .5; }
  .chip small { color: var(--dim); font-size: 14px; }
  #menuBtn { min-width: 44px; padding: 8px 10px; font-size: 20px; line-height: 1; }

  #stage { position: relative; flex: 1; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  #clue { position: absolute; display: none; transform-origin: center; text-align: center; font: 600 22px var(--serif);
          border: 3px solid var(--go); border-radius: 16px; background: #f6fcf6; color: #0b2414; outline: none; padding: 0 12px;
          box-shadow: 0 8px 24px #0006; }
  #toast { position: absolute; left: 50%; bottom: 12px; transform: translate(-50%, 8px); max-width: calc(100% - 24px); background: #08170e; color: var(--fg);
           padding: 10px 16px; border-radius: 14px; font-size: 16px; font-weight: 600; pointer-events: none; opacity: 0; transition: opacity .25s, transform .25s; text-align: center; box-shadow: 0 6px 20px #0008; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  #dock { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--bar); }
  #progress { flex: 1 1 100%; display: flex; align-items: center; gap: 10px; }
  #progMain { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
  #segs { display: flex; gap: 5px; height: 12px; }
  #segs i { flex: 1; border-radius: 6px; border: 2px solid currentColor; opacity: .7; transition: background .35s ease, opacity .35s; }
  #segs i.done { opacity: 1; background: currentColor; }
  #segs i.away { border-style: dashed; }
  #progLabel { font-size: 15px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #alt { white-space: nowrap; font-size: 16px; }
  #hint { flex: 1 1 14em; min-width: 0; color: var(--hint); font-size: 16px; }
  #hint b { color: var(--fg); }
  #dockBtns { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap; justify-content: flex-end; }
  #go { white-space: nowrap; }
  .stepper { display: inline-flex; align-items: center; gap: 2px; background: var(--chip); border-radius: 999px; padding: 2px; font-size: 15px; font-weight: 600; }
  .stepper button { min-height: 40px; min-width: 40px; padding: 0; background: transparent; font-size: 22px; }
  .stepper span { padding: 0 4px; white-space: nowrap; }
  @media (max-width: 480px) {
    #hint { flex-basis: 100%; font-size: 15px; }
    #dockBtns { width: 100%; justify-content: space-between; gap: 6px; }
    .stepper { font-size: 14px; }
    .stepper button { min-width: 34px; }
    .go { padding: 10px 16px; }
  }

  .overlay { position: fixed; inset: 0; background: #000a; display: flex; align-items: flex-end; justify-content: center; z-index: 5;
             opacity: 0; pointer-events: none; transition: opacity .25s; }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .sheet { width: min(460px, 100%); background: var(--sheet); border-radius: 22px 22px 0 0; padding: 22px 18px calc(20px + env(safe-area-inset-bottom, 0px));
           display: flex; flex-direction: column; gap: 14px; max-height: 92%; overflow-y: auto; transform: translateY(24px); transition: transform .3s cubic-bezier(.2,.8,.2,1); }
  .overlay.open .sheet { transform: none; }
  @media (min-width: 600px) { .overlay { align-items: center; } .sheet { border-radius: 22px; } }
  .sheet h2 { margin: 0; font: 600 24px var(--serif); }
  .sheet p { margin: 0; color: var(--dim); font-size: 16px; }
  .sheet input { font: 600 20px var(--sans); color: var(--fg); background: #0004; border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; width: 100%; }
  .brand { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 0 6px; text-align: center; }
  .brand svg { width: 72px; height: 72px; }
  /* The mark settles in once: a quarter turn, easing to rest. */
  .brand svg.bloom { animation: settle 1.1s cubic-bezier(.2,.8,.2,1) both; }
  .brand h1 { margin: 0; font: 600 40px var(--serif); letter-spacing: .02em; }
  .brand p { font-size: 16px; }
  @keyframes settle { from { transform: rotate(-90deg) scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row > .grow { flex: 1; }
  .list { display: flex; flex-direction: column; gap: 6px; }
  .item { display: flex; align-items: center; gap: 10px; padding: 6px 4px; }
  .item .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .link { background: none; padding: 6px 0; min-height: 0; color: var(--dim); text-decoration: underline; font-weight: 600; }
  .menuBtn { text-align: left; border-radius: 14px; background: #ffffff10; width: 100%; }
  .danger { color: #ffc2b8; }
  code { font-size: 14px; color: var(--dim); word-break: break-all; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="mark" viewBox="0 0 100 100">
    <!-- Four cards set as a clover; the gold one is the decoy. -->
    <rect class="lf" x="33" y="10" width="34" height="34" rx="9" transform="rotate(45 50 27)" fill="var(--leaf)"/>
    <rect class="lf" x="56" y="33" width="34" height="34" rx="9" transform="rotate(45 73 50)" fill="var(--leaf)"/>
    <rect class="lf" x="33" y="56" width="34" height="34" rx="9" transform="rotate(45 50 73)" fill="var(--leaf)"/>
    <rect class="lf" x="10" y="33" width="34" height="34" rx="9" transform="rotate(45 27 50)" fill="var(--go)"/>
  </symbol>
</svg>
<div id="top">
  <span id="logo"><svg><use href="#mark"/></svg><span>shamrock</span></span>
  <div id="roster"></div>
  <button id="menuBtn" aria-label="Menu">⋯</button>
</div>
<div id="stage">
  <canvas id="c"></canvas>
  <input id="clue" maxlength="40" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="next" aria-label="Clue">
  <div id="toast" role="status"></div>
</div>
<div id="dock">
  <div id="progress" hidden><div id="progMain"><div id="segs"></div><span id="progLabel"></span></div><button id="alt" hidden></button></div>
  <div id="hint"></div>
  <div id="dockBtns">
    <span class="stepper" id="size" hidden title="Card size on your screen only"><button id="sizeDown" aria-label="Smaller cards">−</button><span>Cards</span><button id="sizeUp" aria-label="Bigger cards">+</button></span>
    <span class="stepper" id="decoys" hidden><button id="decDown" aria-label="Fewer decoy cards">−</button><span id="decLabel"></span><button id="decUp" aria-label="More decoy cards">+</button></span>
    <button id="go" class="go"></button>
  </div>
</div>

<div class="overlay" id="joinSheet">
  <form class="sheet" id="joinForm">
    <div class="brand">
      <svg class="bloom"><use href="#mark"/></svg>
      <h1>shamrock</h1>
      <p>Clue your clover. Guess your friends'.</p>
    </div>
    <input id="nameInput" maxlength="24" placeholder="Your name" autocomplete="nickname" enterkeyhint="go" aria-label="Your name">
    <p>Choosing a name that's already playing takes over that seat, handy for switching devices.</p>
    <div class="list" id="seatList"></div>
    <div class="row"><button type="submit" class="go grow" id="joinBtn">Join</button></div>
    <button type="button" class="link" id="watchBtn">Just watch</button>
  </form>
</div>

<div class="overlay" id="menuSheet">
  <div class="sheet">
    <h2>Table</h2>
    <div class="row"><button class="menuBtn" id="copyLink">Copy invite link</button></div>
    <code id="linkText"></code>
    <button class="menuBtn" id="switchBtn">Switch player / join as someone else</button>
    <button class="menuBtn" id="watchMenuBtn">Watch instead of playing</button>
    <button class="menuBtn" id="redealBtn">Deal new cards (new round, keep scores)</button>
    <button class="menuBtn danger" id="newGameBtn">New game: reset scores, keep who's here</button>
    <div class="list" id="playerList"></div>
    <button id="closeMenu">Close</button>
  </div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
