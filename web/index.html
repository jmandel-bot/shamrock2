<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#173026">
<title>Cloverleaf</title>
<style>
  :root {
    --bg: #1f3b2d; --bar: #173026; --sheet: #20402f; --line: #3d7a52; --fg: #eef7f0; --dim: #a7c4b0;
    --hint: #ffe39a; --go: #f2c14e; --go-fg: #2a2208; --chip: #ffffff14;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 15px/1.35 system-ui, -apple-system, sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; border: 0; border-radius: 999px; background: var(--chip); padding: 8px 14px; min-height: 40px; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--hint); outline-offset: 2px; }
  .go { background: var(--go); color: var(--go-fg); font-weight: 700; padding: 10px 22px; }
  .go:disabled { background: var(--chip); color: var(--fg); }
  .go.on { background: #6fd08a; color: #0f2a17; }

  #top { display: flex; align-items: center; gap: 8px; padding: calc(6px + env(safe-area-inset-top, 0px)) 10px 6px; background: var(--bar); }
  #logo { font-weight: 800; letter-spacing: .02em; white-space: nowrap; }
  #roster { flex: 1; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
  #roster::-webkit-scrollbar { display: none; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 7px; border-radius: 999px; background: var(--chip); font-size: 13px; white-space: nowrap; flex: none; }
  .chip i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .chip.you { box-shadow: 0 0 0 1.5px var(--fg) inset; }
  .chip.writer { box-shadow: 0 0 0 1.5px var(--go) inset; }
  .chip.away { opacity: .4; }
  .chip small { color: var(--dim); }
  #menuBtn { min-width: 40px; padding: 8px 10px; font-size: 18px; line-height: 1; }

  #stage { position: relative; flex: 1; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  #clue { position: absolute; display: none; transform-origin: center; text-align: center; font: 700 18px system-ui, sans-serif;
          border: 2px solid #fff; border-radius: 999px; background: #eaffef; color: #10301a; outline: none; }
  #toast { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); max-width: calc(100% - 24px); background: #000c; color: var(--fg);
           padding: 8px 14px; border-radius: 12px; font-size: 14px; pointer-events: none; opacity: 0; transition: opacity .25s; text-align: center; }
  #toast.show { opacity: 1; }

  #dock { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 12px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--bar); }
  #progress { flex: 1 1 100%; display: flex; align-items: center; gap: 10px; }
  #progMain { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  #segs { display: flex; gap: 4px; height: 10px; }
  #alt { white-space: nowrap; min-height: 34px; padding: 6px 12px; font-size: 14px; }
  #segs i { flex: 1; border-radius: 5px; border: 1.5px solid currentColor; opacity: .55; transition: background .3s, opacity .3s; }
  #segs i.done { opacity: 1; background: currentColor; }
  #segs i.away { border-style: dashed; }
  #progLabel { font-size: 13px; color: var(--dim); white-space: nowrap; }
  #hint { flex: 1 1 14em; min-width: 0; color: var(--hint); font-size: 14px; }
  #hint b { color: var(--fg); }
  #dockBtns { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap; justify-content: flex-end; }
  #go { white-space: nowrap; }
  @media (max-width: 480px) {
    #hint { flex-basis: 100%; }
    #dockBtns { width: 100%; justify-content: space-between; gap: 6px; }
    .stepper { font-size: 12px; }
    .stepper button { min-width: 30px; }
    .go { padding: 10px 16px; }
  }
  .stepper { display: inline-flex; align-items: center; gap: 2px; background: var(--chip); border-radius: 999px; padding: 2px; font-size: 13px; }
  .stepper button { min-height: 34px; min-width: 34px; padding: 0; background: transparent; font-size: 18px; }
  .stepper span { padding: 0 4px; white-space: nowrap; }

  .overlay { position: fixed; inset: 0; background: #0009; display: none; align-items: flex-end; justify-content: center; z-index: 5; }
  .overlay.open { display: flex; }
  .sheet { width: min(460px, 100%); background: var(--sheet); border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px));
           display: flex; flex-direction: column; gap: 12px; max-height: 90%; overflow-y: auto; }
  @media (min-width: 600px) { .overlay { align-items: center; } .sheet { border-radius: 18px; } }
  .sheet h2 { margin: 0; font-size: 19px; }
  .sheet p { margin: 0; color: var(--dim); font-size: 14px; }
  .sheet input { font: inherit; color: var(--fg); background: #0003; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row > .grow { flex: 1; }
  .list { display: flex; flex-direction: column; gap: 6px; }
  .item { display: flex; align-items: center; gap: 10px; padding: 6px 4px; }
  .item .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .link { background: none; padding: 6px 0; min-height: 0; color: var(--dim); text-decoration: underline; }
  .menuBtn { text-align: left; border-radius: 12px; background: #ffffff0d; width: 100%; }
  .danger { color: #ffb4a8; }
  code { font-size: 12px; color: var(--dim); word-break: break-all; }
</style>
</head>
<body>
<div id="top">
  <span id="logo">☘ Cloverleaf</span>
  <div id="roster"></div>
  <button id="menuBtn" aria-label="Menu">⋯</button>
</div>
<div id="stage">
  <canvas id="c"></canvas>
  <input id="clue" maxlength="40" autocomplete="off" enterkeyhint="next" aria-label="Clue">
  <div id="toast"></div>
</div>
<div id="dock">
  <div id="progress" hidden><div id="progMain"><div id="segs"></div><span id="progLabel"></span></div><button id="alt" hidden></button></div>
  <div id="hint"></div>
  <div id="dockBtns">
    <span class="stepper" id="size" hidden title="Card size on your screen only"><button id="sizeDown" aria-label="Smaller cards">−</button><span>Cards</span><button id="sizeUp" aria-label="Bigger cards">+</button></span>
    <span class="stepper" id="decoys" hidden><button id="decDown" aria-label="Fewer extra cards">−</button><span id="decLabel"></span><button id="decUp" aria-label="More extra cards">+</button></span>
    <button id="go" class="go"></button>
  </div>
</div>

<div class="overlay" id="joinSheet">
  <form class="sheet" id="joinForm">
    <h2>Join the table</h2>
    <p>Pick a name. Choosing a name that's already playing takes over that seat (handy for switching devices).</p>
    <input id="nameInput" maxlength="24" placeholder="Your name" autocomplete="nickname" enterkeyhint="go">
    <div class="list" id="seatList"></div>
    <div class="row"><button type="submit" class="go grow" id="joinBtn">Join</button></div>
    <button type="button" class="link" id="watchBtn">Just watch</button>
  </form>
</div>

<div class="overlay" id="menuSheet">
  <div class="sheet">
    <h2>Table</h2>
    <div class="row"><button class="menuBtn" id="copyLink">Copy invite link</button></div>
    <code id="linkText"></code>
    <button class="menuBtn" id="switchBtn">Switch player / join as someone else</button>
    <button class="menuBtn" id="watchMenuBtn">Watch instead of playing</button>
    <button class="menuBtn" id="redealBtn">Deal new cards (new round, keep scores)</button>
    <button class="menuBtn danger" id="newGameBtn">New game: reset scores, keep who's here</button>
    <div class="list" id="playerList"></div>
    <button id="closeMenu">Close</button>
  </div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
