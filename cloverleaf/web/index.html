<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Cloverleaf</title>
<style>
  html, body { margin: 0; height: 100%; background: #1f3b2d; color: #eaf5ec; font: 14px system-ui, sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  #bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 12px; background: #183025; }
  #bar button { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid #3f8f4f; background: #24493a; color: inherit; cursor: pointer; min-height: 32px; }
  #bar button:hover { background: #2f5f4a; }
  #bar .sep { flex: 1; }
  #net { opacity: .85; }
  #status { min-height: 1.2em; padding: 0 12px 6px; background: #183025; color: #ffe08a; }
  #wrap { position: relative; flex: 1; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  #clue { position: absolute; display: none; transform-origin: center; text-align: center; font: 600 18px system-ui, sans-serif;
          border: 2px solid #fff; border-radius: 999px; background: #eaffef; color: #10301a; outline: none; box-sizing: border-box; }
</style>
</head>
<body>
<div id="bar">
  <button id="rotl" title="Rotate my view left (Q)">⟲ Rotate</button>
  <button id="rotr" title="Rotate my view right (E)">Rotate ⟳</button>
  <button data-act="1" title="Deal 5 new cards for everyone">New deal</button>
  <button data-act="2" title="Remember the current board as the answer">Save answer</button>
  <button data-act="3" title="Move every card off the board in random order and rotation">Scramble</button>
  <button data-act="4" title="Compare the board to the saved answer">Check</button>
  <span class="sep"></span>
  <span id="net">connecting…</span>
  <button id="copy" title="Copy a link others can use to join this table">Copy invite link</button>
</div>
<div id="status">Drag cards onto the board, tap a card to rotate it, tap a petal to write a clue.</div>
<div id="wrap"><canvas id="c"></canvas><input id="clue" maxlength="40" autocomplete="off"></div>
<script type="module" src="main.js"></script>
</body>
</html>
