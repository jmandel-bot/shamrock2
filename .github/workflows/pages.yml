name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      # web/core.wasm and web/vendor/ are committed, so the site is static as-is.
      # The game is served at the site root; /web/ only redirects old links there.
      - name: Assemble site
        run: |
          mkdir -p _site/web
          cp -r web/. .nojekyll _site/
          cp legacy-web.html _site/web/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
